<html>
  <head>
    <title>I love tricks - flip</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <header>
      <span></span>
      <p class="header-title">I love tricks</p>
      <a href="https://azarta2zygoto.github.io/tricks">
        <img src="../assets/github.svg" alt="GitHub logo" class="header-logo" />
      </a>
    </header>
    <main style="align-items: center">
      <h1>Faire tourner un élément centré mais non carré</h1>
      <div class="wrapper-input">
        <div class="group-input">
          <label for="colonne">Nb de colonnes : </label>
          <input
            type="number"
            id="colonne"
            class="input number"
            onchange="onChangeNumberColonnes(event)"
            value="4"
            min="1"
          />
        </div>
        <div class="group-input">
          <label for="ligne">Nb de lignes : </label>
          <input
            type="number"
            id="ligne"
            class="input"
            onchange="onChangeNumberLignes(event)"
            value="5"
            min="1"
          />
        </div>
        <div class="group-input">
          <label for="angle">Tourner : </label>
          <button type="button" class="btn" onclick="onClickFlip(1)">
            <img
              src="../assets/turn-right.svg"
              alt="Tourner vers la droite logo"
              class="logo"
            />
          </button>
          <button type="button" class="btn" onclick="onClickFlip(-1)">
            <img
              src="../assets/turn-left.svg"
              alt="Tourner vers la gauche logo"
              class="logo"
            />
          </button>
        </div>
      </div>
      <div class="wrapper-flip">
        <div class="flip" style="transform: rotate(0)" data-value="0" id="flip">
          <div class="element-row">
            <div class="element">1</div>
            <div class="element">2</div>
            <div class="element">3</div>
            <div class="element">4</div>
          </div>
          <div class="element-row">
            <div class="element">5</div>
            <div class="element">6</div>
            <div class="element">7</div>
            <div class="element">8</div>
          </div>
          <div class="element-row">
            <div class="element">9</div>
            <div class="element">10</div>
            <div class="element">11</div>
            <div class="element">12</div>
          </div>
          <div class="element-row">
            <div class="element">13</div>
            <div class="element">14</div>
            <div class="element">15</div>
            <div class="element">16</div>
          </div>
          <div class="element-row">
            <div class="element">17</div>
            <div class="element">18</div>
            <div class="element">19</div>
            <div class="element">20</div>
          </div>
        </div>
      </div>
    </main>
  </body>
  <footer>
    <p>© 2026 tricks. Aucun droit réservé.</p>
  </footer>
  <script src="../script.js" type="text/javascript"></script>
</html>
