<html>
  <head>
    <title>I love tricks - flip</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <header>
      <span></span>
      <p class="header-title">I love tricks</p>
      <a href="https://github.com/Azarta2Zygoto/tricks">
        <img src="../assets/github.svg" alt="GitHub logo" class="header-logo" />
      </a>
    </header>
    <main style="align-items: center">
      <h1>Faire tourner un élément centré mais non carré</h1>
      <div class="wrapper-input">
        <div class="group-input">
          <label for="colonne">Nb de colonnes : </label>
          <input
            type="number"
            id="colonne"
            class="input number"
            onchange="onChangeNumberColonnes(event.target.value)"
            value="4"
            min="1"
          />
        </div>
        <div class="group-input">
          <label for="ligne">Nb de lignes : </label>
          <input
            type="number"
            id="ligne"
            class="input"
            onchange="onChangeNumberLignes(event.target.value)"
            value="5"
            min="1"
          />
        </div>
        <div class="group-input">
          <label for="angle">Tourner : </label>
          <button type="button" class="btn" onclick="onClickFlip(1)">
            <img
              src="../assets/turn-right.svg"
              alt="Tourner vers la droite logo"
              class="logo"
            />
          </button>
          <button type="button" class="btn" onclick="onClickFlip(-1)">
            <img
              src="../assets/turn-left.svg"
              alt="Tourner vers la gauche logo"
              class="logo"
            />
          </button>
        </div>
      </div>
      <div class="wrapper-flip">
        <div class="flip" style="transform: rotate(0)" data-value="0" id="flip">
          <!-- Les éléments seront générés ici par JavaScript -->
      </div>
    </main>
  </body>
  <footer>
    <p>© 2026 tricks. Aucun droit réservé.</p>
  </footer>
  <script src="../script.js" type="text/javascript"></script>
</html>
